services:
  - type: web
    name: datasense-ai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_NAME
        value: DataSense AI
      - key: DEBUG
        value: False
      - key: UPLOAD_DIR
        value: ./uploads
